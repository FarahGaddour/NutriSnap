name: smart_scan1
description: Application NutriSnap - Analyse nutritionnelle par IA

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_ml_model_downloader: ^0.3.2

  # ML Kit
  google_mlkit_image_labeling: ^0.13.0
  google_mlkit_barcode_scanning: ^0.13.0

  # Caméra / Galerie
  image_picker: ^1.1.2

  # HTTP
  http: ^1.2.1

  # Historique
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^18.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/